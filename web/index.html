<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>职场黑话翻译器</title>
<style>
/* 设计语言与小红书卡片完全一致：暖白纸底 / 墨黑 / 蓝+锈红 / 左框色块 / 白底表格 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#FAF7F2; --ink:#1C1A17; --blue:#2E6FD8; --blueL:#E8F0FC;
  --rust:#C8553D; --rustL:#FBEDE8; --mute:#8A8578; --line:#E0D9CC;
  --gold:#B98A1C; --goldL:#FBF3DC; --green:#2E8B57; --greenL:#EAF5EE;
}
body{
  background:var(--paper); color:var(--ink); min-height:100dvh; padding:0 0 56px;
  font-family:'Source Han Sans CN','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:660px;margin:0 auto;padding:0 20px}

/* 抬头 —— 与卡片 kick 同款 */
.kick{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:2px solid var(--ink);padding:28px 0 10px}
.kick .s{font-size:19px;font-weight:800;letter-spacing:.04em}
.kick .s span{color:var(--blue)}
.kick .no{font-size:14px;color:var(--mute);letter-spacing:.06em;white-space:nowrap}
.kick .no b{color:var(--blue);font-size:20px;font-weight:800}

h1{font-size:34px;font-weight:900;line-height:1.22;letter-spacing:-.01em}
h1 .b{color:var(--blue)} h1 .r{color:var(--rust)} h1 .g{color:var(--green)}
.lead{font-size:16px;line-height:1.65;margin-top:10px}
.lead .b{font-weight:800}
.small{font-size:13.5px;color:var(--mute);line-height:1.55}

.step{padding-top:26px}
.lbl{font-size:12px;letter-spacing:.18em;color:var(--mute);font-weight:700;margin-bottom:12px}

/* 卡片容器 —— 白底 + 细线 + 同款圆角 */
.card{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:20px}

textarea{
  width:100%;min-height:90px;padding:0;font:inherit;font-size:17px;line-height:1.6;
  border:0;background:transparent;color:var(--ink);resize:vertical;
}
textarea::placeholder{color:#B5AFA2}
textarea:focus{outline:none}

/* 示例 —— 同 .cell 的圆角 */
.ex{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ex button{
  font:inherit;font-size:13.5px;padding:7px 13px;border-radius:7px;cursor:pointer;
  background:var(--blueL);color:var(--blue);border:0;font-weight:600;
}
.ex button:hover{background:var(--blue);color:#fff}
details.ctx{margin-top:16px}
details.ctx summary{font-size:13.5px;color:var(--mute);cursor:pointer;list-style:none}
details.ctx summary::-webkit-details-marker{display:none}
details.ctx summary::before{content:'＋ ';color:var(--blue);font-weight:800}
details.ctx[open] summary::before{content:'－ '}
details.ctx textarea{min-height:54px;font-size:15px;margin-top:10px;padding-top:10px;
  border-top:1.5px solid var(--line)}

/* 按钮 */
.go{
  width:100%;margin-top:22px;padding:16px;font:inherit;font-size:16px;font-weight:800;
  border-radius:10px;border:0;cursor:pointer;background:var(--ink);color:#fff;
  transition:background .15s;
}
.go:hover{background:var(--blue)}
.go.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.go.ghost:hover{background:var(--paper);color:var(--ink)}

/* 引文 —— 与卡片 .callout 同款的左框 */
.quote{border-left:7px solid var(--blue);background:var(--blueL);
  border-radius:0 10px 10px 0;padding:16px 20px;font-size:19px;font-weight:700;line-height:1.5}
.quote .src{display:block;font-size:13.5px;font-weight:400;color:var(--mute);margin-top:8px}

/* 选项 */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  padding:15px 17px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
  font:inherit;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;
  transition:border-color .12s,background .12s;
}
.opt:hover{border-color:var(--blue);background:var(--blueL)}
.opt .no{font-size:12.5px;font-weight:800;color:var(--blue);letter-spacing:.06em;
  font-variant-numeric:tabular-nums}

/* 判定 */
.mark{font-size:15px;font-weight:800;letter-spacing:.06em;margin-bottom:10px}
.mark.hit{color:var(--green)} .mark.miss{color:var(--rust)}

/* 确定度 */
.conf{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:20px;margin-top:18px}
.conf .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.conf .top .k{font-size:13px;color:var(--mute);font-weight:700;letter-spacing:.06em}
.conf .top .v{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
.bar{height:16px;background:#EFEAE0;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;width:0;
  transition:width .9s cubic-bezier(.16,1,.3,1)}
.tier{display:inline-block;margin-top:13px;font-size:13px;font-weight:800;letter-spacing:.06em;
  padding:5px 13px;border-radius:20px}
.tier.t1{background:var(--greenL);color:var(--green)}
.tier.t2{background:var(--goldL);color:var(--gold)}
.tier.t3{background:var(--rustL);color:var(--rust)}

/* 维度 —— 与卡片表格同款 */
table{width:100%;border-collapse:collapse;background:#fff;font-size:15.5px;
  border-radius:12px;overflow:hidden;margin-top:16px}
th{background:var(--ink);color:#fff;font-weight:700;padding:12px 16px;text-align:left;font-size:14px}
td{padding:13px 16px;border-bottom:1.5px solid var(--line)}
tr:last-child td{border-bottom:0}
td.k{color:var(--mute)}
td.v{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
td.v.yes{color:var(--rust)} td.v.no{color:var(--ink)}

/* 结果行 —— 与卡片 .stats 同款 */
.stats{display:flex;border-top:2px solid var(--ink);margin-top:22px;padding-top:14px}
.stats>div{flex:1;text-align:center}
.stats>div+div{border-left:1.5px solid var(--line)}
.stats .v{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums}
.stats .v.blue{color:var(--blue)} .stats .v.rust{color:var(--rust)}
.stats .l{font-size:13px;color:var(--mute);margin-top:2px}

/* 色块提示 —— 卡片 .callout 直搬 */
.callout{border-left:7px solid var(--rust);background:var(--rustL);
  border-radius:0 10px 10px 0;padding:15px 20px;margin-top:18px;font-size:15.5px;line-height:1.6}
.callout .t{font-size:12px;font-weight:800;color:var(--rust);letter-spacing:.14em;margin-bottom:5px}
.callout.blue{border-color:var(--blue);background:var(--blueL)}
.callout.blue .t{color:var(--blue)}
.callout.green{border-color:var(--green);background:var(--greenL)}
.callout.green .t{color:var(--green)}

.err{margin-top:18px;border-left:7px solid var(--rust);background:var(--rustL);
  border-radius:0 10px 10px 0;padding:15px 20px;color:var(--rust);font-size:15px}
.loading{padding:40px 0;text-align:center;color:var(--mute);font-size:15px;font-weight:700}
.loading i{display:inline-block;animation:pulse 1.4s ease-in-out infinite;font-style:normal}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* 出场节奏 */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.seq>*{animation:rise .5s cubic-bezier(.16,1,.3,1) backwards}
.seq>*:nth-child(1){animation-delay:.02s}
.seq>*:nth-child(2){animation-delay:.12s}
.seq>*:nth-child(3){animation-delay:.22s}
.seq>*:nth-child(4){animation-delay:.32s}
.seq>*:nth-child(5){animation-delay:.42s}
@media(prefers-reduced-motion:reduce){.seq>*{animation:none}.bar i{transition:none}}

.endnote{margin-top:40px;border-top:1.5px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">

  <div class="kick">
    <span class="s">职场黑话<span>翻译器</span></span>
    <span class="no" id="tally"></span>
  </div>

  <!-- ① 输入 -->
  <section class="step" id="s1">
    <div class="lbl">① 贴一句</div>
    <div class="card">
      <textarea id="msg" placeholder="那句你听完没反应过来的话"></textarea>
      <div class="ex" id="ex"></div>
      <details class="ctx">
        <summary>加上文（会准一些）</summary>
        <textarea id="ctx" placeholder="上一句说了什么"></textarea>
      </details>
    </div>
    <button class="go" id="toGuess">下一步 · 先猜一下 →</button>
  </section>

  <!-- ② 猜 -->
  <section class="step" id="s2" hidden>
    <div class="lbl">② 你觉得它实际是什么意思</div>
    <div class="quote" id="q2"></div>
    <div class="opts" id="opts"></div>
  </section>

  <!-- ③ 揭晓 -->
  <section class="step" id="s3" hidden>
    <div class="lbl">③ 阅卷</div>
    <div class="quote" id="q3"></div>
    <div id="out"></div>
  </section>

  <div class="endnote small">
    <b>它为什么给「确定度」</b>——它不生成文字，只做判断，每次返回一个 0–1 的确定度。
    不确定时它会直接认输：「这句我也读不懂」。<br>
    <b>仅供参考</b>——中文的言外之意依赖语境，单句判断有局限。
  </div>
</div>

<script>
const LABELS = {
  literal:     '就是字面意思',
  undecided:   '还没定，要再讨论',
  deferred:    '含糊其辞，不会推进',
  declined:    '在委婉拒绝',
  pushed_back: '把决定推回给你',
  downplayed:  '在轻描淡写，没那么简单',
};
const EXAMPLES = [
  '这个我们后面再讨论',
  '我们先对齐一下',
  '你自己看着办',
  '这个需求很简单，你半天能搞定吧',
  '我建议你再想想',
];

const $ = s => document.querySelector(s);
let msg = '', guess = null;
let stat = JSON.parse(localStorage.getItem('heihua') || '{"c":0,"n":0}');

function paintTally(){
  $('#tally').innerHTML = stat.n ? `你猜中 <b>${stat.c}</b> / ${stat.n}` : '';
}
paintTally();

EXAMPLES.forEach(t => {
  const b = document.createElement('button');
  b.textContent = t;
  b.onclick = () => { $('#msg').value = t; $('#msg').focus(); };
  $('#ex').appendChild(b);
});

$('#toGuess').onclick = () => {
  msg = $('#msg').value.trim();
  if (!msg) { $('#msg').focus(); return; }
  $('#q2').innerHTML = esc(msg);
  const box = $('#opts'); box.innerHTML = '';
  Object.entries(LABELS).forEach(([k, v], i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="no">${String(i + 1).padStart(2, '0')}</span><span>${esc(v)}</span>`;
    b.onclick = () => { guess = k; run(); };
    box.appendChild(b);
  });
  $('#s1').hidden = true; $('#s2').hidden = false; $('#s3').hidden = true;
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

async function run(){
  $('#s2').hidden = true; $('#s3').hidden = false;
  const q = $('#q3');
  q.innerHTML = esc(msg);
  const ctx = $('#ctx').value.trim();
  if (ctx) q.innerHTML += `<span class="src">上文：${esc(ctx)}</span>`;
  $('#out').innerHTML = `<div class="loading"><i>正在阅卷…</i></div>`;

  let r;
  try {
    const res = await fetch('/api/analyze', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: msg, context: ctx }),
    });
    r = await res.json();
    if (!res.ok) throw new Error(r.error || '出错了');
  } catch (e) {
    $('#out').innerHTML = `<div class="err">${esc(e.message)}</div>
      <button class="go ghost" onclick="location.reload()">重来</button>`;
    return;
  }
  render(r);
}

function render(r){
  const m = r.meaning, c = m.confidence;
  const hit = m.choice === guess;
  stat.n++; if (hit) stat.c++;
  localStorage.setItem('heihua', JSON.stringify(stat));
  paintTally();

  const tier = c >= .85 ? ['t1','斩钉截铁','var(--green)']
             : c >= .55 ? ['t2','它也是猜的','var(--gold)']
             : ['t3','这句它也读不懂','var(--rust)'];
  const legend = r.boilerplate.legend || {};
  const bp = Math.round(r.boilerplate.score);
  const bpTxt = legend[String(bp)] || `第 ${bp} 档`;

  $('#out').innerHTML = `
    <div class="seq">
      <div class="callout ${hit ? 'green' : ''}" style="margin-top:18px">
        <div class="t">${hit ? '✓ 你猜对了' : '✗ 你猜的是「' + esc(LABELS[guess]) + '」'}</div>
        <h1 class="${hit ? 'g' : 'r'}" style="font-size:30px">${esc(LABELS[m.choice] || m.choice)}</h1>
      </div>

      <div class="conf">
        <div class="top"><span class="k">它有多确定</span><span class="v" style="color:${tier[2]}">${Math.round(c*100)}%</span></div>
        <div class="bar"><i data-w="${(c*100).toFixed(0)}" style="background:${tier[2]}"></i></div>
        <span class="tier ${tier[0]}">${tier[1]}</span>
      </div>

      <table>
        <tr><th style="width:52%">分项</th><th style="text-align:right">读数</th></tr>
        <tr><td class="k">套话浓度</td><td class="v">${esc(bpTxt)}</td></tr>
        <tr><td class="k">有具体承诺吗</td><td class="v ${r.has_commitment.noul >= .5 ? 'yes':'no'}">${yesno(r.has_commitment.noul)}　${r.has_commitment.noul.toFixed(2)}</td></tr>
        <tr><td class="k">在回避或转移吗</td><td class="v ${r.is_deflecting.noul >= .5 ? 'yes':'no'}">${yesno(r.is_deflecting.noul)}　${r.is_deflecting.noul.toFixed(2)}</td></tr>
        <tr><td class="k">下一步在你手上吗</td><td class="v ${r.needs_me_to_act.noul >= .5 ? 'yes':'no'}">${yesno(r.needs_me_to_act.noul)}　${r.needs_me_to_act.noul.toFixed(2)}</td></tr>
      </table>

      <div class="stats">
        <div><div class="v blue">${stat.c}</div><div class="l">你猜中</div></div>
        <div><div class="v">${stat.n}</div><div class="l">共测</div></div>
        <div><div class="v" style="font-size:18px;padding-top:8px">${esc(r.model)}</div><div class="l">模型</div></div>
      </div>
    </div>

    <button class="go" style="margin-top:24px" onclick="again()">再测一句</button>`;

  requestAnimationFrame(() => {
    const g = $('#out .bar i');
    if (g) requestAnimationFrame(() => { g.style.width = g.dataset.w + '%'; });
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function yesno(p){ return p >= .5 ? '是' : '否'; }
function esc(s){ return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function again(){
  $('#msg').value = ''; $('#ctx').value = ''; guess = null;
  $('#s1').hidden = false; $('#s2').hidden = true; $('#s3').hidden = true;
  window.scrollTo({ top: 0, behavior: 'smooth' }); $('#msg').focus();
}
$('#msg').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') $('#toGuess').click();
});
</script>
</body>
</html>
