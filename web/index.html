<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>职场黑话翻译器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --paper:#FBFAF6;
  --ink:#16150F;
  --ink2:#4A4740;
  --mute:#8D887C;
  --rule:#D6D0C2;
  --rule-soft:#E8E4DA;
  --red:#B3261E;      /* 批注红 */
  --red-soft:#F3E4E1;
  --seal:#9A2A22;
}

html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink);
  min-height:100dvh; padding:0 0 72px;
  font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  font-size:16px; line-height:1.6;
  font-feature-settings:"tnum" 1;
  -webkit-font-smoothing:antialiased;
}
/* 纸张质感：极淡的横向纹理，不是渐变 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(22,21,15,.018) 27px 28px);
}
.wrap{max-width:640px;margin:0 auto;padding:0 22px;position:relative;z-index:1}

/* 衬线：只给标题和大判定用 */
.serif{font-family:'Songti SC','STSong','SimSun',Georgia,'Times New Roman',serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ── 抬头 ── */
header{padding:34px 0 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.brand{font-size:22px;font-weight:700;letter-spacing:.06em}
.brand span{color:var(--red)}
.tagline{font-size:12px;color:var(--mute);letter-spacing:.16em;margin-top:5px}
.tally{font-size:12px;color:var(--mute);letter-spacing:.06em;white-space:nowrap;padding-bottom:3px}
.tally b{color:var(--ink);font-size:15px}
hr.rule{border:0;border-top:2px solid var(--ink);margin:0}
hr.hair{border:0;border-top:1px solid var(--rule);margin:0}

.step{padding-top:34px}
.lbl{
  font-size:11px;letter-spacing:.22em;color:var(--mute);
  display:flex;align-items:center;gap:10px;margin-bottom:16px;
}
.lbl::after{content:'';flex:1;border-top:1px solid var(--rule-soft)}

/* ── 输入 ── */
textarea{
  width:100%;min-height:104px;padding:16px 0;font:inherit;font-size:19px;line-height:1.6;
  border:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:transparent;color:var(--ink);resize:vertical;
}
textarea::placeholder{color:#B9B3A6}
textarea:focus{outline:none;border-color:var(--ink)}
.ex{display:flex;flex-wrap:wrap;gap:0;margin-top:14px;align-items:baseline}
.ex .k{font-size:11px;letter-spacing:.16em;color:var(--mute);margin-right:12px}
.ex button{
  font:inherit;font-size:14px;padding:3px 0;margin-right:16px;cursor:pointer;
  background:none;border:0;border-bottom:1px dotted var(--rule);color:var(--ink2);
}
.ex button:hover{color:var(--red);border-bottom-color:var(--red)}
details.ctx{margin-top:18px}
details.ctx summary{font-size:13px;color:var(--mute);cursor:pointer;letter-spacing:.06em}
details.ctx summary::-webkit-details-marker{display:none}
details.ctx summary::before{content:'＋ ';color:var(--red)}
details.ctx[open] summary::before{content:'－ '}
details.ctx textarea{min-height:60px;font-size:15px;margin-top:12px}

/* ── 按钮 ── */
.go{
  width:100%;margin-top:30px;padding:17px;font:inherit;font-size:16px;font-weight:700;
  letter-spacing:.1em;background:var(--ink);color:var(--paper);border:0;border-radius:0;cursor:pointer;
  transition:background .15s;
}
.go:hover{background:var(--red)}
.go:disabled{background:var(--rule);cursor:default;color:var(--paper)}
.go.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.go.ghost:hover{background:var(--ink);color:var(--paper)}

/* ── 引文 ── */
.quote{
  border-left:2px solid var(--ink);padding:4px 0 4px 20px;
  font-size:24px;line-height:1.5;font-weight:600;
}
.quote .src{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:10px;letter-spacing:.04em}

/* ── 选项：像试卷的题号行 ── */
.opts{margin-top:6px}
.opt{
  width:100%;display:flex;align-items:baseline;gap:16px;text-align:left;
  padding:15px 4px;border:0;border-bottom:1px solid var(--rule-soft);background:none;
  font:inherit;font-size:17px;color:var(--ink);cursor:pointer;transition:padding-left .15s,color .15s;
}
.opt:hover{padding-left:12px;color:var(--red);border-bottom-color:var(--red)}
.opt .no{font-size:13px;color:var(--mute);min-width:20px;letter-spacing:.06em}
.opt:hover .no{color:var(--red)}

/* ── 判定 ── */
.verdict{padding-top:30px}
.mark{font-size:15px;letter-spacing:.14em;font-weight:700;color:var(--mute);margin-bottom:14px}
.mark.hit{color:var(--red)} .mark.miss{color:var(--mute)}
.read{font-size:38px;line-height:1.28;font-weight:700;letter-spacing:-.01em}
.read.hit{color:var(--red)}

/* 确定度 */
.conf{margin-top:30px}
.conf .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.conf .top .k{font-size:12px;letter-spacing:.18em;color:var(--mute)}
.conf .top .v{font-size:30px;font-weight:700}
.gauge{height:6px;background:var(--rule-soft);position:relative;overflow:hidden}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--ink);display:block;width:0;
  transition:width .9s cubic-bezier(.16,1,.3,1)}
.gauge i.low{background:var(--red)}
.tier{display:inline-block;margin-top:12px;font-size:12px;letter-spacing:.14em;
  padding:4px 10px;border:1px solid currentColor}
.tier.t1{color:var(--ink)} .tier.t2{color:var(--mute)} .tier.t3{color:var(--red)}

/* 维度：像成绩单的行 */
.dims{margin-top:34px}
.dim{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:13px 0;border-bottom:1px solid var(--rule-soft);font-size:15px}
.dim:first-child{border-top:1px solid var(--rule-soft)}
.dim .k{color:var(--mute)}
.dim .v{font-weight:600;letter-spacing:.02em}
.dim .v.yes{color:var(--red)} .dim .v.no{color:var(--ink)}

/* 落款 */
.footline{margin-top:30px;padding-top:16px;border-top:2px solid var(--ink);
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:14px}
.footline .who{color:var(--mute);letter-spacing:.04em}
.footline .who b{color:var(--ink)}
.footline .sc{letter-spacing:.06em;color:var(--mute)}
.footline .sc b{color:var(--ink);font-size:17px}

.err{margin-top:24px;padding:16px;border:1px solid var(--red);color:var(--red);font-size:15px}
.loading{padding:48px 0;text-align:center;color:var(--mute);letter-spacing:.16em;font-size:14px}
.loading i{display:inline-block;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* ── 出场：一次编排好的节奏，不是散落的微交互 ── */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.seq>*{animation:rise .55s cubic-bezier(.16,1,.3,1) backwards}
.seq>*:nth-child(1){animation-delay:.02s}
.seq>*:nth-child(2){animation-delay:.14s}
.seq>*:nth-child(3){animation-delay:.26s}
.seq>*:nth-child(4){animation-delay:.38s}
.seq>*:nth-child(5){animation-delay:.5s}
.seq>*:nth-child(6){animation-delay:.62s}
@media(prefers-reduced-motion:reduce){.seq>*{animation:none}.gauge i{transition:none}}

.endnote{margin-top:52px;padding-top:18px;border-top:1px solid var(--rule-soft);
  font-size:12.5px;color:var(--mute);line-height:1.85}
.endnote b{color:var(--ink2);font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand serif">职场黑话<span>翻译器</span></div>
      <div class="tagline">读懂话里有话</div>
    </div>
    <div class="tally" id="tally"></div>
  </header>
  <hr class="rule">

  <!-- ① 输入 -->
  <section class="step" id="s1">
    <div class="lbl">一 · 贴一句</div>
    <textarea id="msg" placeholder="那句你听完没反应过来的话"></textarea>
    <div class="ex"><span class="k">试试</span><span id="ex"></span></div>
    <details class="ctx">
      <summary>加上文（会准一些）</summary>
      <textarea id="ctx" placeholder="上一句说了什么"></textarea>
    </details>
    <button class="go" id="toGuess">下一步 · 先猜一下</button>
  </section>

  <!-- ② 猜 -->
  <section class="step" id="s2" hidden>
    <div class="lbl">二 · 你的判断</div>
    <div class="quote serif" id="q2"></div>
    <div style="margin-top:34px" class="lbl">它实际是什么意思</div>
    <div class="opts" id="opts"></div>
  </section>

  <!-- ③ 揭晓 -->
  <section class="step" id="s3" hidden>
    <div class="lbl">三 · 阅卷</div>
    <div class="quote serif" id="q3"></div>
    <div id="out"></div>
  </section>

  <div class="endnote">
    <b>判断由 Jev 完成</b>——它不生成文字，只做判断，并给出 0–1 的确定度。
    不确定时它会直接说「读不懂」。<br>
    <b>仅供参考</b>——中文的言外之意依赖语境，单句判断有局限。
  </div>
</div>

<script>
const LABELS = {
  literal:     '就是字面意思',
  undecided:   '还没定，要再讨论',
  deferred:    '含糊其辞，不会推进',
  declined:    '在委婉拒绝',
  pushed_back: '把决定推回给你',
  downplayed:  '在轻描淡写，没那么简单',
};
const EXAMPLES = [
  '这个我们后面再讨论',
  '我们先对齐一下',
  '你自己看着办',
  '这个需求很简单，你半天能搞定吧',
  '我建议你再想想',
];

const $ = s => document.querySelector(s);
let msg = '', guess = null;
let stat = JSON.parse(localStorage.getItem('heihua') || '{"c":0,"n":0}');

function paintTally(){
  $('#tally').innerHTML = stat.n ? `猜中 <b>${stat.c}</b> / ${stat.n}` : '';
}
paintTally();

EXAMPLES.forEach((t, i) => {
  const b = document.createElement('button');
  b.textContent = t;
  b.onclick = () => { $('#msg').value = t; $('#msg').focus(); };
  $('#ex').appendChild(b);
});

$('#toGuess').onclick = () => {
  msg = $('#msg').value.trim();
  if (!msg) { $('#msg').focus(); return; }
  $('#q2').innerHTML = esc(msg);
  const box = $('#opts'); box.innerHTML = '';
  Object.entries(LABELS).forEach(([k, v], i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="no mono">${String(i + 1).padStart(2, '0')}</span><span>${esc(v)}</span>`;
    b.onclick = () => { guess = k; run(); };
    box.appendChild(b);
  });
  $('#s1').hidden = true; $('#s2').hidden = false; $('#s3').hidden = true;
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

async function run(){
  $('#s2').hidden = true; $('#s3').hidden = false;
  const q = $('#q3');
  q.innerHTML = esc(msg);
  const ctx = $('#ctx').value.trim();
  if (ctx) q.innerHTML += `<span class="src">上文：${esc(ctx)}</span>`;
  $('#out').innerHTML = `<div class="loading"><i>正在阅卷</i></div>`;

  let r;
  try {
    const res = await fetch('/api/analyze', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: msg, context: ctx }),
    });
    r = await res.json();
    if (!res.ok) throw new Error(r.error || '出错了');
  } catch (e) {
    $('#out').innerHTML = `<div class="err">${esc(e.message)}</div>
      <button class="go ghost" style="margin-top:22px" onclick="location.reload()">重来</button>`;
    return;
  }
  render(r);
}

function render(r){
  const m = r.meaning, c = m.confidence;
  const hit = m.choice === guess;
  stat.n++; if (hit) stat.c++;
  localStorage.setItem('heihua', JSON.stringify(stat));
  paintTally();

  const tier = c >= .85 ? ['t1','斩钉截铁']
             : c >= .55 ? ['t2','它也是猜的']
             : ['t3','这句它也读不懂'];
  const legend = r.boilerplate.legend || {};
  const bp = Math.round(r.boilerplate.score);
  const bpTxt = legend[String(bp)] || `第 ${bp} 档`;

  $('#out').innerHTML = `
    <div class="seq">
      <div class="verdict">
        <div class="mark ${hit ? 'hit' : 'miss'}">${hit ? '✓ 你猜对了' : '✗ 你猜的是「' + esc(LABELS[guess]) + '」'}</div>
        <div class="read serif ${hit ? 'hit' : ''}">${esc(LABELS[m.choice] || m.choice)}</div>
      </div>

      <div class="conf">
        <div class="top"><span class="k">它有多确定</span><span class="v mono">${Math.round(c*100)}%</span></div>
        <div class="gauge"><i class="${c < .55 ? 'low' : ''}" data-w="${(c*100).toFixed(0)}"></i></div>
        <span class="tier ${tier[0]}">${tier[1]}</span>
      </div>

      <div class="dims">
        <div class="dim"><span class="k">套话浓度</span><span class="v">${esc(bpTxt)}</span></div>
        <div class="dim"><span class="k">有具体承诺吗</span><span class="v ${r.has_commitment.noul >= .5 ? 'yes':'no'} mono">${yesno(r.has_commitment.noul)} ${r.has_commitment.noul.toFixed(2)}</span></div>
        <div class="dim"><span class="k">在回避或转移吗</span><span class="v ${r.is_deflecting.noul >= .5 ? 'yes':'no'} mono">${yesno(r.is_deflecting.noul)} ${r.is_deflecting.noul.toFixed(2)}</span></div>
        <div class="dim"><span class="k">下一步在你手上吗</span><span class="v ${r.needs_me_to_act.noul >= .5 ? 'yes':'no'} mono">${yesno(r.needs_me_to_act.noul)} ${r.needs_me_to_act.noul.toFixed(2)}</span></div>
      </div>

      <div class="footline">
        <span class="who">累计 <b>${stat.c}</b> / ${stat.n}</span>
        <span class="sc mono">${esc(r.model)}</span>
      </div>
    </div>

    <button class="go" style="margin-top:34px" onclick="again()">再测一句</button>`;

  requestAnimationFrame(() => {
    const g = $('#out .gauge i');
    if (g) requestAnimationFrame(() => { g.style.width = g.dataset.w + '%'; });
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function yesno(p){ return p >= .5 ? '是' : '否'; }
function esc(s){ return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function again(){
  $('#msg').value = ''; $('#ctx').value = ''; guess = null;
  $('#s1').hidden = false; $('#s2').hidden = true; $('#s3').hidden = true;
  window.scrollTo({ top: 0, behavior: 'smooth' }); $('#msg').focus();
}
$('#msg').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') $('#toGuess').click();
});
</script>
</body>
</html>
